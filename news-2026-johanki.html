@media (min-width: 701px) and (max-width: 900px) {

}

      <ul class="event-list">
        ${m.events.map(e => `<li><span class="ev-date">${e[0]}</span><span class="ev-loc">${e[1]}</span><span class="ev-desc">${e[2]}</span></li>`).join('')}
      </ul>
    </div>
    <div class="card-footer">クリックで拡大表示 →</div>
  `;
  card.addEventListener('click', () => openModal(idx));
  grid.appendChild(card);
});

function openModal(idx) {
  const m = months[idx];
  modalTitle.textContent = `2026年 ${m.label}`;
  modalList.innerHTML = m.events.map(e =>
    `<li><span class="m-date">${e[0]}</span><span class="m-loc">${e[1]}</span><span class="m-desc">${e[2]}</span></li>`
  ).join('');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
