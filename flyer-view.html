<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開催チラシ | JDRS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; min-height: 100vh; padding: 20px; }
.back-btn {
  display: inline-block;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  font-size: 14px;
  padding: 8px 20px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  margin-bottom: 20px;
  font-family: 'Noto Sans JP', sans-serif;
}
.back-btn:hover { background: rgba(255,255,255,0.1); }
.flyer-wrap {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.flyer-wrap img {
  width: 100%;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: block;
}
.label {
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  text-align: center;
  margin-bottom: 6px;
  font-family: sans-serif;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
<a class="back-btn" onclick="history.back(); return false;" href="#">← 開催スケジュールへ戻る</a>
<div class="flyer-wrap" id="wrap"></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var n = params.get('v');
  if (!n) { document.getElementById('wrap').innerHTML = '<p style="color:white;text-align:center;">チラシが見つかりません</p>'; return; }
  var wrap = document.getElementById('wrap');
  var sanka = document.createElement('div');
  sanka.innerHTML = '<div class="label">▼ 参加募集チラシ</div><img src="flyers-sanka/スライド' + n + '.JPG" alt="参加募集チラシ" loading="lazy">';
  wrap.appendChild(sanka);
  var kenngaku = document.createElement('div');
  kenngaku.innerHTML = '<div class="label">▼ 見学案内チラシ</div><img src="flyers/スライド' + n + '.JPG" alt="見学案内チラシ" loading="lazy">';
  wrap.appendChild(kenngaku);
})();
</script>
</body>
</html>
