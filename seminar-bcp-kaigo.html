<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:#0a1628;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}

.card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(198,153,58,0.25);
  border-radius:20px;
  padding:52px 40px;
  max-width:540px;
  width:100%;
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,0.4);
}

/* 工事中イラスト（SVG） */
.construction-img{
  width:180px;
  height:180px;
  margin:0 auto 32px;
  display:block;
}

.label{
  display:inline-block;
  background:rgba(198,153,58,0.12);
  border:1px solid rgba(198,153,58,0.35);
  color:#dbb35c;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.12em;
  padding:4px 16px;
  border-radius:20px;
  margin-bottom:18px;
}

h1{
  font-family:'Noto Serif JP',serif;
  font-size:clamp(22px,5vw,30px);
  font-weight:700;
  line-height:1.5;
  margin-bottom:16px;
}
h1 em{color:#c23a22;font-style:normal;}

.sub{
  font-size:14px;
  color:rgba(255,255,255,0.6);
  line-height:1.9;
  margin-bottom:32px;
}

.divider{
  height:1px;
  background:rgba(198,153,58,0.2);
  margin:28px 0;
}

.target-label{
  font-size:12px;
  color:rgba(255,255,255,0.45);
  margin-bottom:12px;
  letter-spacing:0.05em;
}

.target-tags{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-bottom:32px;
}

.tag{
  background:rgba(194,58,34,0.1);
  border:1px solid rgba(194,58,34,0.3);
  color:#e08070;
  font-size:12px;
  font-weight:500;
  padding:5px 14px;
  border-radius:20px;
}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#c23a22,#a02010);
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  padding:12px 32px;
  border-radius:8px;
  letter-spacing:0.05em;
  transition:all 0.2s;
  box-shadow:0 4px 14px rgba(194,58,34,0.35);
}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(194,58,34,0.45);}

.contact-link{
  display:block;
  margin-top:16px;
  font-size:13px;
  color:rgba(255,255,255,0.45);
  text-decoration:none;
}
.contact-link:hover{color:rgba(255,255,255,0.75);}

.footer-note{
  margin-top:40px;
  font-size:11px;
  color:rgba(255,255,255,0.25);
  letter-spacing:0.05em;
}
</style>
</head>
<body>

<div class="card">

  <!-- 工事中SVGイラスト -->

    <path d="M83 110 Q90 117 97 110" stroke="#3a2010" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="148" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#e87060">!</text>
  </svg>

  <div class="label">🚧　UNDER CONSTRUCTION　🚧</div>

  <div class="divider"></div>

  <div class="target-label">対象施設</div>
  <div class="target-tags">
    <span class="tag">介護老人保健施設</span>
    <span class="tag">特別養護老人ホーム</span>

</html>
